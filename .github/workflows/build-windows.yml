name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    name: QuickPOS Windows x64
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      NODE_VERSION: 24.22.0
      PNPM_VERSION: 10.32.1

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          package-manager-cache: false

      - name: Read package version
        id: package
        shell: powershell
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "package.json contains an invalid release version: $version"
          }
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version`n")

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts', 'src/**') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Run source checks
        run: |
          pnpm typecheck
          pnpm lint
          pnpm windows:check
          pnpm test

      - name: Build standalone application
        run: pnpm build
        env:
          DATABASE_ADAPTER: sqlite
          DATABASE_URL: file:./ci-build.db
          NEXT_TELEMETRY_DISABLED: '1'
          PAYLOAD_SECRET: windows-build-only-secret-not-packaged

      - name: Assemble offline Windows release
        shell: powershell
        run: |
          $nodeExecutable = (Get-Command node.exe).Source
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File scripts/windows/package-release.ps1 `
            -NodeVersion $env:NODE_VERSION `
            -NodeExecutable $nodeExecutable

      - name: Smoke-test packaged runtime
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/windows/smoke-test.ps1

      - name: Compile Inno Setup installer
        shell: powershell
        env:
          QUICKPOS_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup 6 is not installed on this Windows runner."
          }

          & $iscc "/DMyAppVersion=$env:QUICKPOS_VERSION" "installer\quickpos.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Create installer manifests
        shell: powershell
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass
          -File scripts/windows/write-installer-manifest.ps1
          -SourceCommit $env:GITHUB_SHA

      - name: Upload private workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: QuickPOS-Windows-x64-v${{ steps.package.outputs.version }}
          path: dist/windows/installer/*
          if-no-files-found: error
          retention-days: 14
